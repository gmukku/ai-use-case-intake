name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Names that must not appear in a public repo. gitleaks finds credentials; this finds
      # identifying strings, which are not secrets but do not belong here either.
      #
      # It exists because the name came back. A history rewrite removed it, and four commits
      # later it was quoted again — inside the learning-log entry describing that very
      # rewrite. The original check ran once, against the past. This one runs on every push.
      #
      # The pattern is a character class so this file does not itself spell out the string it
      # guards against, and both counts are asserted explicitly: grep exits 1 when it finds
      # nothing, which is the *pass*, so an exit code here means the opposite of what it
      # looks like. That confusion is how the original check managed to report a clean repo.
      - name: denylisted names
        run: |
          tree=$(git grep -Ii -E 'E[x]tensis' -- . | wc -l || true)
          hist=$(git log -p --all | grep -ciE 'E[x]tensis' || true)
          echo "occurrences — working tree: $tree, history: $hist"
          if [ "$tree" -ne 0 ] || [ "$hist" -ne 0 ]; then
            echo "::error::a denylisted name is present; it must not reach a public repo"
            exit 1
          fi

  backend:
    name: backend — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Unit tests never call the model; no API key is configured here on purpose.
      - run: uv run pytest -q
      # Deterministic and free. Exits non-zero on a scrutiny false negative, which is the
      # failure the risk gate exists to prevent.
      - run: uv run python evals/risk_gate/run.py

  frontend:
    name: frontend — lint, types, build, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `next typegen` writes PageProps / LayoutProps / RouteContext into .next/types, and
      # both that directory and next-env.d.ts are gitignored — so a fresh checkout cannot
      # typecheck without generating them first. `npm run typecheck` does both.
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm run build
      # The auth core: passwords, session signing, and that a session dies with its account.
      - run: npm test
